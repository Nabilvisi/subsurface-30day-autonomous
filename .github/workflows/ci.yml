name: Validate Streamlit Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test roadmap and schedule
        run: pytest -q

      - name: Run security gate
        run: python security_gate.py app.py subsurface_lab/labs.py automation/run_daily.py

      - name: Compile Python modules
        run: python -m compileall -q app.py subsurface_lab automation
