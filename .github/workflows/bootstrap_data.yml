name: Bootstrap Day 01 Volve Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "subsurface_lab/data.py"
      - "data/manifest.json"
      - "automation/bootstrap_day01_data.py"
      - ".github/workflows/bootstrap_data.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize compact Day-01 dataset
        run: python automation/bootstrap_day01_data.py

      - name: Validate Day-01 dataset
        run: |
          python - <<'PY'
          import pandas as pd
          p = "data/day_01/volve_15_9_F_1B.csv"
          df = pd.read_csv(p)
          required = {"DEPTH", "GR", "RHOB", "NPHI", "RT"}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"Missing required columns: {sorted(missing)}")
          if len(df) < 100:
              raise SystemExit(f"Unexpectedly small dataset: {len(df)} rows")
          print(f"Validated {len(df)} rows; columns={list(df.columns)}")
          PY

      - name: Commit materialized data
        run: |
          if [[ -n "$(git status --porcelain data/day_01/volve_15_9_F_1B.csv)" ]]; then
            git config user.name "subsurface-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/day_01/volve_15_9_F_1B.csv
            git commit -m "data: materialize Volve Day 01 well logs"
            git pull --rebase origin main
            git push
          else
            echo "Day-01 persistent dataset already up to date."
          fi
